[package]
name = "github-tools"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "github-tools"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
# CLI
clap = { version = "4", features = ["derive", "env"] }

# Error handling
anyhow = "1"

# Env / config
dotenvy = "0.15"

# HTTP
reqwest = { version = "0.12", features = ["json", "blocking"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# CSV
csv = "1"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Regex
regex = "1"

# SemVer parsing
semver = "1"

# URL encoding
urlencoding = "2"
charming = "0.3"
