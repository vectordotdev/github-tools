name: Sync GitHub metrics to Datadog
description: Build github-tools, fetch repository data locally, and publish Datadog metrics

inputs:
  repo:
    description: Repository to sync, as owner/repo
    required: true
  lookback:
    description: Historical emission lookback
    required: false
    default: 30d
  activity_window:
    description: Rolling window used by closed-item metrics
    required: false
    default: 30d
  metric_prefix:
    description: Datadog metric prefix
    required: false
    default: github.health
  dry_run:
    description: Fetch and preview historical metrics without submitting
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install Rust
      shell: bash
      run: rustup toolchain install stable --profile minimal

    - name: Build github-tools
      shell: bash
      run: cargo build --locked --release

    - name: Run metrics sync
      shell: bash
      env:
        DRY_RUN: ${{ inputs.dry_run }}
        TARGET_REPO: ${{ inputs.repo }}
        LOOKBACK: ${{ inputs.lookback }}
        METRIC_PREFIX: ${{ inputs.metric_prefix }}
        ACTIVITY_WINDOW: ${{ inputs.activity_window }}
      run: |
        bash "${{ github.action_path }}/../../../scripts/sync-datadog-metrics.sh" \
          "${TARGET_REPO}" \
          "${LOOKBACK}" \
          "${METRIC_PREFIX}" \
          "${ACTIVITY_WINDOW}"
