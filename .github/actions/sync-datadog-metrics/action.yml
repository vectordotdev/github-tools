name: Sync GitHub metrics to Datadog
description: Build github-tools and sync one repository's data and Datadog metrics

inputs:
  repo:
    description: Repository to sync, as owner/repo
    required: true
  lookback:
    description: Fetch and activity lookback
    required: false
    default: 30d
  metric_prefix:
    description: Datadog metric prefix
    required: false
    default: github.health
  dry_run:
    description: Fetch and preview without submitting metrics
    required: false
    default: "false"
  signing_private_key:
    description: Passphrase-free SSH private key used to sign data commits (required unless dry_run is true)
    required: false
  commit_user_name:
    description: Git author name for signed data commits (required unless dry_run is true)
    required: false
  commit_user_email:
    description: Git author email for signed data commits (required unless dry_run is true)
    required: false

runs:
  using: composite
  steps:
    - name: Install Rust
      shell: bash
      run: rustup toolchain install stable --profile minimal

    - name: Build github-tools
      shell: bash
      run: cargo build --locked --release

    - name: Run metrics sync
      shell: bash
      env:
        DRY_RUN: ${{ inputs.dry_run }}
        TARGET_REPO: ${{ inputs.repo }}
        LOOKBACK: ${{ inputs.lookback }}
        METRIC_PREFIX: ${{ inputs.metric_prefix }}
      run: |
        bash "${{ github.action_path }}/../../../scripts/sync-datadog-metrics.sh" \
          "${TARGET_REPO}" \
          "${LOOKBACK}" \
          "${METRIC_PREFIX}"

    - name: Commit and push data changes
      if: ${{ inputs.dry_run != 'true' }}
      shell: bash
      env:
        TARGET_REPO: ${{ inputs.repo }}
        SIGNING_PRIVATE_KEY: ${{ inputs.signing_private_key }}
        COMMIT_USER_NAME: ${{ inputs.commit_user_name }}
        COMMIT_USER_EMAIL: ${{ inputs.commit_user_email }}
      run: |
        set -euo pipefail

        if [[ -z "${SIGNING_PRIVATE_KEY}" || -z "${COMMIT_USER_NAME}" || -z "${COMMIT_USER_EMAIL}" ]]; then
          echo "signing_private_key, commit_user_name, and commit_user_email are required" >&2
          exit 2
        fi

        branch="$(git symbolic-ref --quiet --short HEAD)" || {
          echo "cannot push data changes from a detached HEAD; check out the target branch first" >&2
          exit 2
        }
        data_dir="data/${TARGET_REPO/\//_}"

        git add -A -- "${data_dir}"
        if git diff --cached --quiet -- "${data_dir}"; then
          echo "No data changes to commit for ${TARGET_REPO}."
          exit 0
        fi

        signing_key="${RUNNER_TEMP}/github-tools-signing-key"
        cleanup() {
          rm -f -- "${signing_key}"
        }
        trap cleanup EXIT
        umask 077
        printf '%s\n' "${SIGNING_PRIVATE_KEY}" | tr -d '\r' > "${signing_key}"
        ssh-keygen -y -f "${signing_key}" >/dev/null

        git \
          -c user.name="${COMMIT_USER_NAME}" \
          -c user.email="${COMMIT_USER_EMAIL}" \
          -c gpg.format=ssh \
          -c user.signingkey="${signing_key}" \
          commit -S -m "chore(data): sync ${TARGET_REPO}" -- "${data_dir}"
        git push origin "HEAD:${branch}"
